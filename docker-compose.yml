name: atlas-global
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-atlas_global}
      POSTGRES_USER: ${DB_USERNAME:-atlas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-atlas_global}
      DB_USERNAME: ${DB_USERNAME:-atlas}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      WORLD_BANK_SCHEDULE_ENABLED: ${WORLD_BANK_SCHEDULE_ENABLED:-false}
      WORLD_BANK_IMPORT_CRON: ${WORLD_BANK_IMPORT_CRON:-0 0 3 * * SUN}
      WORLD_BANK_COUNTRIES: ${WORLD_BANK_COUNTRIES:-ARG,AUS,BRA,CAN,CHL,CHN,FRA,HKG,ISR,ITA,JPN,PRY,POL,PRT,RUS,SGP,KOR,ESP,CHE,UKR,GBR,USA,VEN,VNM}
      WORLD_BANK_FROM_YEAR: ${WORLD_BANK_FROM_YEAR:-1960}
      WORLD_BANK_TO_YEAR: ${WORLD_BANK_TO_YEAR:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
