spring:
  application:
    name: atlas-global
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlas_global}
    username: ${DB_USERNAME:atlas}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      enabled: false
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
atlas:
  import:
    run-once: ${WORLD_BANK_IMPORT_ONCE:false}
    schedule-enabled: ${WORLD_BANK_SCHEDULE_ENABLED:false}
    cron: ${WORLD_BANK_IMPORT_CRON:0 0 3 * * SUN}
    countries: ${WORLD_BANK_COUNTRIES:BRA,USA,CHN,RUS,DEU,JPN,GBR,FRA,IND}
    from-year: ${WORLD_BANK_FROM_YEAR:1960}
    to-year: ${WORLD_BANK_TO_YEAR:0}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
logging:
  structured:
    format:
      console: ecs
springdoc:
  default-produces-media-type: application/json
  paths-to-match: /api/v1/**
  api-docs:
    version: OPENAPI_3_0
    path: /api/openapi
  swagger-ui:
    path: /api/docs
    disable-swagger-default-url: true
