# Render publishes one application port. Actuator remains on loopback only.
server:
  port: ${PORT:10000}
  address: 0.0.0.0
  shutdown: graceful
  tomcat:
    threads:
      max: 16
      min-spare: 2
    max-connections: 128
    accept-count: 32
  compression:
    enabled: true
    min-response-size: 1024B
    mime-types: application/json,application/problem+json,text/csv
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # Direct endpoint: session advisory locks and Flyway must not use transaction pooling.
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory&connectTimeout=10&socketTimeout=60&tcpKeepAlive=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 300000
      keepalive-time: 0
      connection-timeout: 30000
      validation-timeout: 5000
management:
  server:
    address: 127.0.0.1
    port: 8081
atlas:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  import:
    schedule-enabled: ${WORLD_BANK_SCHEDULE_ENABLED:false}
  additional-import:
    schedule-enabled: ${ADDITIONAL_SOURCES_SCHEDULE_ENABLED:false}
  policy-rates:
    schedule-enabled: ${POLICY_RATE_SCHEDULE_ENABLED:false}
