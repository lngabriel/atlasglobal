name: atlas-global-production
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: postgres:17-alpine
    logging: *bounded-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-atlas_global}
      POSTGRES_USER: ${DB_USERNAME:-atlas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a production database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    restart: unless-stopped
  backend:
    image: ${ATLAS_BACKEND_IMAGE:?Set the verified backend image digest or commit tag}
    logging: *bounded-logging
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-atlas_global}
      DB_USERNAME: ${DB_USERNAME:-atlas}
      DB_PASSWORD: ${DB_PASSWORD:?Set a production database password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set the exact public HTTPS origin}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      WORLD_BANK_SCHEDULE_ENABLED: ${WORLD_BANK_SCHEDULE_ENABLED:-false}
      WORLD_BANK_IMPORT_CRON: ${WORLD_BANK_IMPORT_CRON:-0 0 3 * * SUN}
      WORLD_BANK_COUNTRIES: ${WORLD_BANK_COUNTRIES:-ARG,AUS,BRA,CAN,CHL,CHN,FRA,HKG,ISR,ITA,JPN,PRY,POL,PRT,RUS,SGP,KOR,ESP,CHE,UKR,GBR,USA,VEN,VNM}
      WORLD_BANK_FROM_YEAR: ${WORLD_BANK_FROM_YEAR:-1960}
      WORLD_BANK_TO_YEAR: ${WORLD_BANK_TO_YEAR:-0}
      ADDITIONAL_SOURCES_SCHEDULE_ENABLED: ${ADDITIONAL_SOURCES_SCHEDULE_ENABLED:-false}
      ADDITIONAL_SOURCES_IMPORT_CRON: ${ADDITIONAL_SOURCES_IMPORT_CRON:-0 0 5 * * SAT}
      POLICY_RATE_SCHEDULE_ENABLED: ${POLICY_RATE_SCHEDULE_ENABLED:-false}
      POLICY_RATE_FROM: ${POLICY_RATE_FROM:-2010-01-01}
      POLICY_RATE_IMPORT_CRON: ${POLICY_RATE_IMPORT_CRON:-0 0 4 * * *}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
  frontend:
    image: ${ATLAS_FRONTEND_IMAGE:?Set the verified frontend image digest or commit tag}
    logging: *bounded-logging
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    volumes:
      - ./trusted-proxies.conf:/etc/nginx/atlas/trusted-proxies.conf:ro
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
