name: Publish container images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&event=push&per_page=1" --jq '.workflow_runs | length')
          test "$count" -gt 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Normalize the registry repository name
        id: names
        env:
          ATLAS_REPOSITORY: ${{ github.repository }}
        run: echo "repository=${ATLAS_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Report the immutable deployment reference
        env:
          ATLAS_IMAGE: ghcr.io/${{ steps.names.outputs.repository }}/${{ matrix.service }}
          ATLAS_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "${ATLAS_IMAGE}@${ATLAS_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
