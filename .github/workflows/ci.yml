name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: atlas_test
          POSTGRES_USER: atlas_test
          POSTGRES_PASSWORD: atlas-ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas_test -d atlas_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/atlas_test
      DB_USERNAME: atlas_test
      DB_PASSWORD: atlas-ci-test-only
      WORLD_BANK_SCHEDULE_ENABLED: 'false'
      POLICY_RATE_SCHEDULE_ENABLED: 'false'
      ADDITIONAL_SOURCES_SCHEDULE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B --no-transfer-progress -f backend/pom.xml -Pintegration verify
      - name: Audit resolved runtime dependencies
        run: |
          python3 -m unittest discover -s scripts/tests
          mvn -B --no-transfer-progress -f backend/pom.xml dependency:list -DincludeScope=runtime -DoutputFile="$GITHUB_WORKSPACE/maven-runtime.txt"
          python3 scripts/audit_maven.py "$GITHUB_WORKSPACE/maven-runtime.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-reports-postgres-${{ matrix.postgres }}
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate the Cloudflare Pages artifact without publishing
        env:
          VITE_API_BASE_URL: https://atlas-global-api.onrender.com
        run: npm run build:pages
      - run: npm audit --audit-level=high
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: atlas-ci
      DB_PASSWORD: atlas-ci-test-only
      POLICY_RATE_SCHEDULE_ENABLED: 'false'
      WORLD_BANK_SCHEDULE_ENABLED: 'false'
      ADDITIONAL_SOURCES_SCHEDULE_ENABLED: 'false'
      ATLAS_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Wait for the application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/countries/TWN > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs --tail=100
          exit 1
      - run: npm --prefix frontend run test:smoke
      - run: npm --prefix frontend run test:browser -- --cold-start-check
      - run: npm --prefix frontend run test:http -- --rate-limit-check
      - name: Verify the production runtime configuration
        env:
          ATLAS_BACKEND_IMAGE: atlas-ci-backend
          ATLAS_FRONTEND_IMAGE: atlas-ci-frontend
          CORS_ALLOWED_ORIGINS: http://localhost:3300
          FRONTEND_PORT: '3300'
        run: docker compose -p atlas-ci-production -f infrastructure/production/compose.yml up -d --wait
      - name: Smoke check the production runtime
        env:
          ATLAS_BASE_URL: http://127.0.0.1:3300
        run: npm --prefix frontend run test:smoke
      - name: Capture runtime logs
        if: failure()
        run: docker compose logs --tail=150
      - name: Remove the isolated CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Remove the isolated production check
        if: always()
        env:
          ATLAS_BACKEND_IMAGE: atlas-ci-backend
          ATLAS_FRONTEND_IMAGE: atlas-ci-frontend
          CORS_ALLOWED_ORIGINS: http://localhost:3300
          FRONTEND_PORT: '3300'
        run: docker compose -p atlas-ci-production -f infrastructure/production/compose.yml down --volumes --remove-orphans
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
