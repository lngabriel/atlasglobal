map $request_method $atlas_limit_key {
    default "";
    GET $binary_remote_addr;
    HEAD $binary_remote_addr;
}
map $status $atlas_retry_after {
    default "";
    429 1;
}
limit_req_zone $atlas_limit_key zone=atlas_api:10m rate=10r/s;
limit_req_zone $atlas_limit_key zone=atlas_exports:1m rate=2r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/atlas/trusted-proxies.conf;
    client_max_body_size 1m;
    limit_req_status 429;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json application/geo+json application/javascript text/css image/svg+xml;
    add_header Retry-After $atlas_retry_after always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        limit_req zone=atlas_api burst=100 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location ~ ^/api/v1/(exports/indicators|policy-rates/export)$ {
        limit_req zone=atlas_api burst=100 nodelay;
        limit_req zone=atlas_exports burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /api/swagger-ui/ {
        limit_req zone=atlas_api burst=100 nodelay;
        add_header Retry-After $atlas_retry_after always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }
    location /actuator { return 404; }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location /assets/ {
        try_files $uri =404;
        expires 365d;
    }
    location /geodata/ {
        types { application/geo+json geojson; text/plain md; }
        try_files $uri =404;
        expires 1d;
    }
    location = /index.html {
        expires -1;
    }
    location / { try_files $uri $uri/ /index.html; }
}
